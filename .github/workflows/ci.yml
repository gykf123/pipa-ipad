name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-check:
    name: Linux 语法 + 数值验证 + 工具冒烟
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9.2"

      - name: Swift 语法检查（全部 .swift 文件）
        run: |
          ERRS=0
          for f in $(find PipaRender -name "*.swift"); do
            OUT=$(swiftc -parse "$f" 2>&1) || true
            if [ -n "$OUT" ]; then echo "=== FAIL: $f"; echo "$OUT"; ERRS=$((ERRS+1)); fi
          done
          if [ $ERRS -ne 0 ]; then echo "$ERRS 个文件语法错误"; exit 1; fi
          echo "SYNTAX CHECK: ALL OK"

      - name: Python 工具冒烟（打包器 / 验证器）
        run: |
          pip install numpy pillow
          python3 tools/pack_package.py --help > /dev/null
          python3 tools/validate_package.py sample/琵琶曲.pipapkg.zip
          python3 tools/validate_package.py sample/steve_walk_spin.v2.zip

      - name: 数值验证（Linux simd 兼容层 + numpy 独立复刻对比）
        working-directory: tools/swift_logic_check
        run: |
          set -e
          # Linux 无 simd 模块：编译兼容层
          swiftc -emit-module -emit-library -module-name simd simd_shim.swift -o libsimd.so
          # Linux 无 ProcessInfo.ThermalState：生成等价测试副本
          python3 - <<'PYEOF'
          src = open('../../PipaRender/PipaRender/Render/RenderSettings.swift').read()
          src = src.replace('mutating func update(thermalState: ProcessInfo.ThermalState, avgFrameMs: Double) {',
                            'mutating func update(thermalState: Int, avgFrameMs: Double) {')
          for a, b in [('case .critical:', 'case 3:'), ('case .serious:', 'case 2:'),
                       ('case .fair:', 'case 1:'), ('case .nominal:', 'case 0:'),
                       ('@unknown default:', 'default:')]:
              src = src.replace(a, b)
          open('RenderSettings_linux.swift', 'w').write(src)
          PYEOF
          swiftc -I. -L. -lsimd -o test_runner main.swift RenderSettings_linux.swift \
            ../../PipaRender/PipaRender/Render/RenderMath.swift \
            ../../PipaRender/PipaRender/Render/Skinner.swift \
            ../../PipaRender/PipaRender/Render/VisibilityBitmap.swift
          LD_LIBRARY_PATH=. ./test_runner
          python3 compare.py

      - name: JIT 编码验证（结构断言 + clang golden-bytes 比对）
        run: |
          set -e
          cd tools/jit_encode_check
          # Linux 无 simd 模块：编译兼容层（与 swift_logic_check 同款 shim）
          swiftc -emit-module -emit-library -module-name simd ../swift_logic_check/simd_shim.swift -o libsimd.so
          swiftc -I. -L. -lsimd -o jit_runner main.swift \
            ../../PipaRender/PipaRender/Render/RenderMath.swift \
            ../../PipaRender/PipaRender/Render/Skinner.swift \
            ../../PipaRender/PipaRender/JIT/JITAssembler.swift \
            ../../PipaRender/PipaRender/JIT/JITKernels.swift \
            ../../PipaRender/PipaRender/JIT/JITEngine.swift \
            ../../PipaRender/PipaRender/JIT/JITAvailability.swift \
            ../../PipaRender/PipaRender/JIT/JITSkinning.swift
          LD_LIBRARY_PATH=. ./jit_runner
          cd ../..
          # golden-bytes：clang 交叉汇编 kernel_ref.s 作权威参考逐字节比对。
          # 手写编码器没有编译器兜底——曾编出不存在的 GP SMAX/SMIN（真机 SIGILL）。
          python3 tools/golden_check/golden_diff.py tools/jit_encode_check/jit_code.bin

  ios-build:
    name: iOS 编译验证（macOS，不签名）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: PipaRender
        run: xcodegen generate

      - name: xcodebuild（验证 Swift + Metal shader 编译，不签名）
        working-directory: PipaRender
        run: |
          set -o pipefail
          xcodebuild -project PipaRender.xcodeproj \
            -scheme PipaRender \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: JIT 内核真执行验证（macOS arm64 + allow-jit 签名）
        run: |
          set -e
          # 1. 生成确定性数据文件（与 Linux 同款 jit_runner；macOS 用原生 simd 无需 shim）
          cd tools/jit_encode_check
          swiftc -O -o jit_runner main.swift \
            ../../PipaRender/PipaRender/Render/RenderMath.swift \
            ../../PipaRender/PipaRender/Render/Skinner.swift \
            ../../PipaRender/PipaRender/JIT/JITAssembler.swift \
            ../../PipaRender/PipaRender/JIT/JITKernels.swift \
            ../../PipaRender/PipaRender/JIT/JITEngine.swift \
            ../../PipaRender/PipaRender/JIT/JITAvailability.swift \
            ../../PipaRender/PipaRender/JIT/JITSkinning.swift
          ./jit_runner > /dev/null
          # 2. ad-hoc 签名 + allow-jit entitlement（macOS 上放行 MAP_JIT）
          cd ../jit_exec_check
          cat > jit.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
          </dict>
          </plist>
          EOF
          swiftc -O -o jit_exec_check main.swift \
            ../../PipaRender/PipaRender/JIT/JITEngine.swift
          codesign --sign - --entitlements jit.entitlements --force jit_exec_check
          # 3. 真执行：mmap 跑 ARM64 内核 vs Swift 参考输出（Skinner.matrices 语义等价）
          cp ../jit_encode_check/jit_code.bin ../jit_encode_check/jit_track.bin \
             ../jit_encode_check/jit_arm.bin ../jit_encode_check/jit_expected.txt .
          ./jit_exec_check

      - name: 打包未签名 IPA 并上传产物
        working-directory: PipaRender
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphoneos/PipaRender.app"
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }
          rm -rf Payload PipaRender-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PipaRender-unsigned.ipa Payload
          ls -lh PipaRender-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: pipa-render-ios-unsigned
          path: PipaRender/PipaRender-unsigned.ipa
          if-no-files-found: error
